<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function (location) {
        if (location.search[1] !== "/") return;
        var decoded = location.search
          .slice(1)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, "", location.pathname.slice(0, -1) + decoded + location.hash);
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ireland’s fastest route to a consultant dermatologist diagnosis. Days, not months."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AllView Healthcare — Days, not months</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
